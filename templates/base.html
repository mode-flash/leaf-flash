<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}{{ theme.SITE_NAME_EN }} | {{ theme.SITE_NAME_JA }}{% endblock %}</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Zen+Kaku+Gothic+New:wght@900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="{{ asset_prefix }}static/theme.css">
<link rel="stylesheet" href="{{ asset_prefix }}static/style.css">
<noscript><style>.section-head{opacity:1!important;transform:none!important;}</style></noscript>
</head>
<body>
<header class="site-header">
  <a class="brand" href="{{ asset_prefix }}index.html">
    <span class="brand-en">{{ theme.SITE_NAME_EN }}</span>
    <span class="brand-ja">{{ theme.SITE_NAME_JA }}</span>
  </a>
  <span class="tagline">{{ theme.TAGLINE }}</span>
</header>
<nav class="site-nav">
{% for href, label in theme.NAV_ITEMS %}
  <a href="{{ asset_prefix }}{{ href }}">{{ label }}</a>
{% endfor %}
</nav>
<main>
{% block content %}{% endblock %}
</main>
<footer class="site-footer">
  {{ theme.FOOTER_TEXT }}
</footer>
<script src="{{ asset_prefix }}static/main.js" defer></script>
</body>
</html>
